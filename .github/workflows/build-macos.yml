name: build-macos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    # Repo is public, so Actions minutes are free: build and test macOS on PRs too.
    runs-on: macos-26   # arm64, Xcode 26.x default (macos-14 is EOL Nov 2 2026)
    steps:
      - uses: actions/checkout@v4
      - name: Block calibration files
        run: bash scripts/check-cal-files.sh
      - name: Toolchain
        run: xcodebuild -version && xcrun --show-sdk-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden signal dependencies
        run: python -m pip install -r tools/requirements-golden.txt
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Zip app
        run: |
          APP=$(find build -name "FOH Gauge.app" -type d -path "*Release*" | head -1)
          echo "Found $APP"; file "$APP/Contents/MacOS/"*
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist"); echo "LSMinimumSystemVersion=$MIN"
          [ "$MIN" = "26.0" ] || { echo "::error::LSMinimumSystemVersion is $MIN, expected 26.0"; exit 1; }
          vtool -show-build "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q "minos 26.0" || { echo "::error::binary minos is not 26.0"; exit 1; }
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP"
          ditto -c -k --keepParent "$APP" FOH-Gauge-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FOH-Gauge-macOS-arm64
          path: FOH-Gauge-macOS-arm64.zip
  linux-tests:
    # Core-only (FOH_BUILD_APP=OFF, no JUCE fetch); this is the PR gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block calibration files
        run: bash scripts/check-cal-files.sh
      - name: Check public strings
        run: scripts/check-strings.sh
      - name: Test PR gate scans
        run: bash scripts/test-pr-gate-scans.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden signal dependencies
        run: python -m pip install -r tools/requirements-golden.txt
      - run: cmake -S . -B build -DFOH_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel && ctest --test-dir build --output-on-failure
