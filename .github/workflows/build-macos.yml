name: build-macos
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Zip app
        run: |
          APP=$(find build -name "FOH Gauge.app" -type d -path "*Release*" | head -1)
          echo "Found $APP"; file "$APP/Contents/MacOS/"*
          ditto -c -k --keepParent "$APP" FOH-Gauge-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FOH-Gauge-macOS-arm64
          path: FOH-Gauge-macOS-arm64.zip
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DFOH_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel && ctest --test-dir build --output-on-failure
