name: build-macos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    # Repo is public, so Actions minutes are free: build and test macOS on PRs too.
    runs-on: macos-26   # arm64, Xcode 26.x default (macos-14 is EOL Nov 2 2026)
    steps:
      - uses: actions/checkout@v4
      - name: Check UI tokens
        run: bash scripts/check-ui-tokens.sh
      - name: Block calibration files
        run: bash scripts/check-cal-files.sh
      - name: Toolchain
        run: xcodebuild -version && xcrun --show-sdk-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden signal dependencies
        run: python -m pip install -r tools/requirements-golden.txt
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Zip app
        run: |
          APP=$(find build -name "FOH Gauge.app" -type d -path "*Release*" | head -1)
          echo "Found $APP"; file "$APP/Contents/MacOS/"*
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist"); echo "LSMinimumSystemVersion=$MIN"
          [ "$MIN" = "26.0" ] || { echo "::error::LSMinimumSystemVersion is $MIN, expected 26.0"; exit 1; }
          vtool -show-build "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q "minos 26.0" || { echo "::error::binary minos is not 26.0"; exit 1; }
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist"); echo "CFBundleIconFile=$ICON"
          [ "${ICON%.icns}" = "AppIcon" ] || { echo "::error::CFBundleIconFile is '$ICON', expected AppIcon"; exit 1; }
          ICNS="$APP/Contents/Resources/AppIcon.icns"; test -s "$ICNS" || { echo "::error::AppIcon.icns missing from bundle"; exit 1; }
          iconutil -c iconset "$ICNS" -o /tmp/AppIcon-check.iconset && ls -l /tmp/AppIcon-check.iconset
          [ "$(ls /tmp/AppIcon-check.iconset | wc -l)" -ge 10 ] || { echo "::error::AppIcon.icns is incomplete"; exit 1; }
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP"
          ditto -c -k --keepParent "$APP" FOH-Gauge-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FOH-Gauge-macOS-arm64
          path: FOH-Gauge-macOS-arm64.zip
  linux-tests:
    # Core-only (FOH_BUILD_APP=OFF, no JUCE fetch); this is the PR gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check UI tokens
        run: bash scripts/check-ui-tokens.sh
      - name: Block calibration files
        run: bash scripts/check-cal-files.sh
      - name: Check public strings
        run: scripts/check-strings.sh
      - name: Test PR gate scans
        run: bash scripts/test-pr-gate-scans.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden signal dependencies
        run: python -m pip install -r tools/requirements-golden.txt
      - run: cmake -S . -B build -DFOH_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel && ctest --test-dir build --output-on-failure

  windows-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    continue-on-error: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Block calibration files and check public strings
        shell: bash
        run: |
          bash scripts/check-cal-files.sh
          bash scripts/check-strings.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden signal dependencies
        run: python -m pip install -r tools/requirements-golden.txt
      - name: Configure (WASAPI, no ASIO SDK)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DFOH_ENABLE_ASIO=OFF
      - name: Build app and tests
        run: cmake --build build --config Release --parallel
      - name: Unit tests (core, golden signals and app)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package and launch artifact
        shell: pwsh
        run: |
          $exe = Get-Item "build/app/FOHGauge_artefacts/Release/FOH Gauge.exe"
          Compress-Archive -Path $exe.FullName -DestinationPath FOH-Gauge-Windows-x64.zip
          Expand-Archive FOH-Gauge-Windows-x64.zip -DestinationPath smoke
          $process = Start-Process -FilePath "$pwd/smoke/FOH Gauge.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "App exited during startup: $($process.ExitCode)" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0 -or !$process.Responding -or $process.MainWindowTitle -ne "FOH Gauge") {
              throw "Artifact did not open a responsive FOH Gauge window"
            }
            if (!$process.CloseMainWindow()) { throw "Could not close the app window" }
            if (!$process.WaitForExit(15000)) { throw "App did not shut down normally" }
            if ($process.ExitCode -ne 0) { throw "App shutdown failed: $($process.ExitCode)" }
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FOH-Gauge-Windows-x64
          path: FOH-Gauge-Windows-x64.zip
