name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and release
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      APP_NAME: FOH Gauge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden signal dependencies
        run: python -m pip install -r tools/requirements-golden.txt
      - name: Derive version from tag
        run: |
          VER="${TAG#v}"; VER="${VER%%-*}"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z[-suffix]"; exit 1; }
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Configure (universal, macOS 26.0, unsigned)
        run: >
          cmake -S . -B build -G Xcode
          -DFOH_APP_VERSION="$APP_VERSION"
          -DFOH_BUILD_NUMBER="$BUILD_NUMBER"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Locate and verify app
        run: |
          APP=$(find build -name "$APP_NAME.app" -type d -path "*Release*" | head -1)
          test -n "$APP" || { echo "::error::app bundle not found"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          BIN=$(find "$APP/Contents/MacOS" -type f -perm -u+x | head -1)
          lipo -info "$BIN"
          vtool -show-build "$BIN" | grep -E 'minos|platform' || otool -l "$BIN" | grep -A4 LC_BUILD_VERSION
          PL="$APP/Contents/Info.plist"
          for k in CFBundleShortVersionString CFBundleVersion LSMinimumSystemVersion; do
            echo "$k=$(/usr/libexec/PlistBuddy -c "Print :$k" "$PL")"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PL")" = "26.0"
      - name: Ad-hoc signature (not a Developer ID signature; required to launch on arm64)
        run: |
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP"
      - name: Package zip and DMG
        run: |
          OUT="FOH-Gauge-$TAG-macOS"
          ditto -c -k --keepParent "$APP" "$OUT.zip"
          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/$APP_NAME.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" -ov -format UDZO "$OUT.dmg"
          shasum -a 256 "$OUT.zip" "$OUT.dmg" | tee SHA256SUMS
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned test build (ad-hoc signature, not notarized). Requires macOS 26."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "FOH Gauge $TAG" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$OUT.zip" "$OUT.dmg" SHA256SUMS --clobber
          else
            gh release create "$TAG" "$OUT.zip" "$OUT.dmg" SHA256SUMS --title "FOH Gauge $TAG" --notes "$NOTES" --prerelease --verify-tag
          fi
      - name: Verify prerelease and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json isPrerelease,assets | jq -e --arg out "$OUT" '
            .isPrerelease == true and
            ([.assets[].name] | contains([$out + ".zip", $out + ".dmg", "SHA256SUMS"]))
          '
