name: license-guard
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test license guard
        run: python3 -m unittest discover -s scripts -p 'test_license_guard.py'
      - name: Check dependency and asset licenses
        run: python3 scripts/license_guard.py
